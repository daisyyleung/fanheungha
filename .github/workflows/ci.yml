name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Verify generated Drizzle metadata is committed
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate public repository on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/validate-public-repo.mjs --check=all

      - name: Validate public repository on pull request
        if: github.event_name == 'pull_request'
        run: node scripts/validate-public-repo.mjs --check=all --skip=git-history
