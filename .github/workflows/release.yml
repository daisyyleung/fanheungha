name: Signed draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm

      - name: Verify tag identity and signature
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$TAG" == "v${VERSION}" ]]
          REF_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          [[ "$(jq -r '.object.type' <<<"$REF_JSON")" == "tag" ]]
          TAG_OBJECT_SHA="$(jq -r '.object.sha' <<<"$REF_JSON")"
          TAG_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}")"
          [[ "$(jq -r '.tag' <<<"$TAG_JSON")" == "$TAG" ]]
          [[ "$(jq -r '.verification.verified' <<<"$TAG_JSON")" == "true" ]]
          [[ "$(jq -r '.object.type' <<<"$TAG_JSON")" == "commit" ]]
          [[ "$(jq -r '.object.sha' <<<"$TAG_JSON")" == "$GITHUB_SHA" ]]
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "VERIFIED_TAG_OBJECT_SHA=$TAG_OBJECT_SHA" >> "$GITHUB_ENV"
          echo "VERIFIED_MAIN_ANCESTRY=true" >> "$GITHUB_ENV"

      - name: Install lockfile dependencies
        run: npm ci

      - name: Verify generated Drizzle metadata
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle

      - name: Run full checks
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm test
          node scripts/validate-public-repo.mjs --check=all

      - name: Build deterministic archive and release SBOM
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="fanheungha-${VERSION}.tar.gz"
          git archive --format=tar --prefix="fanheungha-${VERSION}/" "$GITHUB_SHA" | gzip -n > "$ARCHIVE"
          npm sbom --sbom-format=spdx --package-lock-only > SBOM.spdx.json
          node -e 'const x=require("./SBOM.spdx.json"); if(x.spdxVersion!=="SPDX-2.3") throw new Error("SBOM must be SPDX-2.3");'
          sha256sum "$ARCHIVE" SBOM.spdx.json | LC_ALL=C sort > SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE="fanheungha-${VERSION}.tar.gz"
          gh release create "v${VERSION}" "$ARCHIVE" SBOM.spdx.json SHA256SUMS \
            --draft --title "fanheungha v${VERSION}" \
            --notes "Draft release: review the archive, SHA256SUMS, and SPDX SBOM before publishing."
